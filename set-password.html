<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8f1d28"><title>设置同步密码</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#faf8f4;color:#292523}.wrap{max-width:560px;margin:0 auto;padding:42px 18px}.card{background:#fff;border:1px solid #eadfd5;border-radius:20px;padding:24px;box-shadow:0 12px 35px #6d4c3d14}h1{color:#8f1d28;margin-top:0}input,button{width:100%;box-sizing:border-box;font:inherit;border-radius:12px;padding:13px 14px;margin-top:10px}input{border:1px solid #d8cec5}button{border:0;background:#8f1d28;color:white;font-weight:700}.muted{color:#766f69;line-height:1.6;font-size:14px}.ok{color:#267349}.err{color:#b13b3b}</style></head><body><div class="wrap"><div class="card"><h1>设置同步密码</h1><p class="muted">请用刚才已通过邮件登录成功的 Safari 打开本页。设置成功后，手机桌面 App 和电脑都可直接使用“邮箱 + 密码”登录，不再需要邮件链接。</p><div id="status" class="muted">正在检查 Safari 登录状态……</div><div id="form" style="display:none"><input id="pw1" type="password" autocomplete="new-password" placeholder="设置密码（至少 8 位）"><input id="pw2" type="password" autocomplete="new-password" placeholder="再次输入密码"><button id="btn">保存同步密码</button></div></div></div><script>const URL='https://deuzexrjpzwgohiacbph.supabase.co';const KEY='sb_publishable_rcTZItogYlTTVJAA4xfzyA_FLqxeP5D';const SESSION_KEY='party48_supabase_session_v1';const s=()=>{try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch(_){return null}};const status=document.getElementById('status'),form=document.getElementById('form');let sess=s();if(!sess?.access_token){status.className='err';status.innerHTML='当前 Safari 没有检测到已登录状态。请先回到之前邮件登录成功后的学习助手网页，再从同一个 Safari 打开本页。';}else{const email=sess.user?.email||'当前账号';status.className='ok';status.textContent='已识别登录账号：'+email;form.style.display='block';document.getElementById('btn').onclick=async()=>{const p1=document.getElementById('pw1').value,p2=document.getElementById('pw2').value;if(p1.length<8){status.className='err';status.textContent='密码至少 8 位';return}if(p1!==p2){status.className='err';status.textContent='两次输入的密码不一致';return}const btn=document.getElementById('btn');btn.disabled=true;btn.textContent='正在保存…';try{const r=await fetch(URL+'/auth/v1/user',{method:'PUT',headers:{'apikey':KEY,'Authorization':'Bearer '+sess.access_token,'Content-Type':'application/json'},body:JSON.stringify({password:p1})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||j.msg||j.error_description||('HTTP '+r.status));status.className='ok';status.innerHTML='设置成功！现在可以关闭 Safari，打开桌面“党校学习助手”，用同一邮箱和这个密码登录。';document.getElementById('pw1').value='';document.getElementById('pw2').value='';}catch(e){status.className='err';status.textContent='设置失败：'+(e.message||e)}finally{btn.disabled=false;btn.textContent='保存同步密码'}}}</script></body></html>
