<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8f1d28"><title>第48期校党校学习助手</title>
<style>
:root{--r:#8f1d28;--g:#25734c;--bg:#faf8f4;--line:#e9e1d7;--muted:#746d68}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(#f4e9e4,#faf8f4 330px);color:#292523}header{background:linear-gradient(135deg,#721720,#a32a34);color:#fff;padding:24px 16px 34px}header>div,main{max-width:960px;margin:auto}h1{margin:0 0 7px;font-size:28px}.sub{opacity:.92}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.badge{border:1px solid #ffffff66;border-radius:999px;padding:5px 10px;font-size:12px}main{margin-top:-18px;padding:0 14px 50px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 8px 28px #50372812}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stat{text-align:center;background:#fffaf4;border:1px solid #efe2d1;border-radius:13px;padding:10px}.stat b{display:block;color:var(--r);font-size:20px}.stat span,.small{font-size:12px;color:var(--muted)}button,input,select{font:inherit}button{border:0;border-radius:11px;padding:10px 13px;background:#f2ece7;cursor:pointer}button.primary{background:var(--r);color:#fff}button.outline{background:#fff;border:1px solid #d9cfc6}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}.login input{min-width:230px;padding:10px 12px;border:1px solid #d9cfc6;border-radius:10px}.nav{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.title{font-weight:800;color:#6e151b;font-size:18px;margin-bottom:12px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}select{padding:9px;border:1px solid #d9cfc6;border-radius:10px;background:#fff}.q{font-weight:750;font-size:18px;line-height:1.55;margin:10px 0}.option{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border:1px solid #ddd3ca;border-radius:12px;background:#fff}.option.correct{background:#edf8f1;border-color:#78b697}.option.wrong{background:#fff0f0;border-color:#e2a2a2}.explain{margin-top:12px;background:#f7f2eb;border-radius:12px;padding:12px;line-height:1.65}.item{padding:12px 0;border-bottom:1px dashed #ddd}.item:last-child{border:0}.card{min-height:220px;border:1px solid #e7ddd4;border-radius:17px;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:linear-gradient(160deg,#fff,#fff7ed);cursor:pointer}.card b{font-size:20px;line-height:1.6}.card .back{font-size:18px;line-height:1.7}.good{color:var(--g)}.err{color:#b13b3b}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#282421;color:#fff;padding:10px 14px;border-radius:12px;z-index:99}.tip{background:#fff4e0;border-left:4px solid #aa7c35;padding:12px;border-radius:8px;line-height:1.6}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.stats .stat:last-child{grid-column:span 2}h1{font-size:24px}.login input{width:100%;min-width:0}}
</style>
</head>
<body>
<header><div><h1>第48期校党校学习助手</h1><div class="sub">云端动态题库 · 手机电脑同步 · 错题本 · 收藏 · 背诵卡</div><div class="badges"><span class="badge" id="cloud">正在连接云端</span><span class="badge" id="version">题库版本：--</span><span class="badge" id="count">题库：--</span></div></div></header>
<main>
<section class="panel"><div class="stats"><div class="stat"><b id="sTotal">0</b><span>题库</span></div><div class="stat"><b id="sDone">0</b><span>累计作答</span></div><div class="stat"><b id="sAcc">0%</b><span>正确率</span></div><div class="stat"><b id="sWrong">0</b><span>错题</span></div><div class="stat"><b id="sStar">0</b><span>收藏</span></div></div></section>
<section class="panel"><div class="row"><div class="grow"><b id="accountTitle">登录后开启跨设备同步</b><div class="small" id="accountText">手机和电脑使用同一个邮箱登录即可同步学习记录。</div></div><div class="row login" id="loginBox"><input id="email" type="email" placeholder="输入邮箱"><button class="primary" onclick="login()">发送登录链接</button></div><div class="row hidden" id="logoutBox"><button class="outline" onclick="reloadAll()">检查题库更新</button><button onclick="logout()">退出</button></div></div></section>
<section class="panel"><div class="nav"><button class="primary" onclick="tab('quiz')">开始刷题</button><button onclick="tab('new')">最近新增</button><button onclick="tab('cards')">背诵卡</button><button onclick="tab('wrong')">错题本</button><button onclick="tab('star')">收藏</button></div></section>
<section id="quiz" class="panel page"><div class="title">随机刷题</div><div class="filters"><select id="cat" onchange="newQuiz()"><option value="ALL">全部模块</option></select><select id="num" onchange="newQuiz()"><option>10</option><option selected>20</option><option>30</option><option value="999">全部</option></select><button onclick="newQuiz()">换一套</button></div><div id="quizBox"></div></section>
<section id="new" class="panel page hidden"><div class="title">最近新增 / 更新</div><div id="newBox"></div></section>
<section id="cards" class="panel page hidden"><div class="title">背诵卡</div><div class="filters"><select id="cardCat" onchange="resetCards()"><option value="ALL">全部模块</option></select></div><div id="cardBox" class="card" onclick="flipCard()"></div><div class="row" style="justify-content:space-between;margin-top:10px"><button onclick="prevCard()">上一张</button><span class="small" id="cardPos"></span><button class="primary" onclick="nextCard()">下一张</button></div></section>
<section id="wrong" class="panel page hidden"><div class="title">错题本</div><div id="wrongBox"></div></section>
<section id="star" class="panel page hidden"><div class="title">我的收藏</div><div id="starBox"></div></section>
<section class="panel"><div class="tip">学习辅助工具，非学校官方题库。最终以学校正式资料、党章原文和考试通知为准。</div></section>
</main><div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL='https://deuzexrjpzwgohiacbph.supabase.co';
const KEY='sb_publishable_rcTZItogYlTTVJAA4xfzyA_FLqxeP5D';
const sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let user=null,Q=[],C=[],meta={},qp=new Map(),cp=new Map(),set=[],pos=0,locked=false,cards=[],cpos=0,flipped=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2600)}
function p(id){return qp.get(id)||{attempts:0,correct_count:0,wrong_count:0,is_wrong:false,mastered:false,starred:false}}
function cprog(id){return cp.get(id)||{seen_count:0,mastered:false,starred:false}}
async function init(){sb.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;setTimeout(authUI,0)});let r=await sb.auth.getSession();user=r.data.session?.user||null;await loadBank();await authUI();subscribe()}
async function loadBank(){document.getElementById('cloud').textContent='正在同步题库';let [qr,cr,mr]=await Promise.all([sb.from('questions').select('*').eq('status','published').order('external_id'),sb.from('cards').select('*').eq('status','published').order('external_id'),sb.from('app_meta').select('*').eq('id','main').maybeSingle()]);if(qr.error||cr.error){document.getElementById('cloud').textContent='云端连接失败';return}Q=qr.data||[];C=cr.data||[];meta=mr.data||{};document.getElementById('cloud').textContent='题库在线';document.getElementById('version').textContent='题库版本：'+(meta.bank_version||'V2');document.getElementById('count').textContent='题库：'+Q.length+'题';selectors();stats();newQuiz();resetCards();renderNew();renderWrong();renderStar()}
async function authUI(){if(user){document.getElementById('loginBox').classList.add('hidden');document.getElementById('logoutBox').classList.remove('hidden');document.getElementById('accountTitle').textContent='已登录 · 云同步开启';document.getElementById('accountText').textContent=user.email+' · 学习进度会在设备间同步';await loadProgress();document.getElementById('cloud').textContent='云同步已连接'}else{document.getElementById('loginBox').classList.remove('hidden');document.getElementById('logoutBox').classList.add('hidden');document.getElementById('accountTitle').textContent='登录后开启跨设备同步';document.getElementById('accountText').textContent='同一个邮箱在手机和电脑登录即可同步错题、收藏和学习进度。'}}
async function login(){let email=document.getElementById('email').value.trim();if(!email)return toast('请先输入邮箱');let redirect=location.origin+location.pathname;let {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:redirect}});toast(error?'发送失败：'+error.message:'登录链接已发送，请查收邮箱')}
async function logout(){await sb.auth.signOut();qp.clear();cp.clear();user=null;stats();renderWrong();renderStar();toast('已退出登录')}
async function loadProgress(){if(!user)return;let [a,b]=await Promise.all([sb.from('question_progress').select('*').eq('user_id',user.id),sb.from('card_progress').select('*').eq('user_id',user.id)]);if(!a.error)qp=new Map((a.data||[]).map(x=>[x.question_id,x]));if(!b.error)cp=new Map((b.data||[]).map(x=>[x.card_id,x]));stats();renderWrong();renderStar();resetCards()}
async function saveQ(id,x){if(!user)return;await sb.from('question_progress').upsert({user_id:user.id,question_id:id,attempts:x.attempts||0,correct_count:x.correct_count||0,wrong_count:x.wrong_count||0,is_wrong:!!x.is_wrong,mastered:!!x.mastered,starred:!!x.starred,last_answer:x.last_answer??null},{onConflict:'user_id,question_id'})}
async function saveC(id,x){if(!user)return;await sb.from('card_progress').upsert({user_id:user.id,card_id:id,seen_count:x.seen_count||0,mastered:!!x.mastered,starred:!!x.starred},{onConflict:'user_id,card_id'})}
function selectors(){let cats=[...new Set(Q.map(x=>x.category))];for(let id of ['cat','cardCat']){let e=document.getElementById(id),old=e.value;e.innerHTML='<option value="ALL">全部模块</option>';cats.forEach(x=>e.add(new Option(x,x)));if([...e.options].some(o=>o.value===old))e.value=old}}
function stats(){let done=0,cor=0,w=0,s=0;for(let x of qp.values()){done+=x.attempts||0;cor+=x.correct_count||0;if(x.is_wrong&&!x.mastered)w++;if(x.starred)s++}sTotal.textContent=Q.length;sDone.textContent=done;sAcc.textContent=done?Math.round(cor/done*100)+'%':'0%';sWrong.textContent=w;sStar.textContent=s}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newQuiz(){let cat=document.getElementById('cat').value,n=+document.getElementById('num').value,pool=Q.filter(x=>cat==='ALL'||x.category===cat);set=shuffle(pool).slice(0,Math.min(n,pool.length));pos=0;renderQ()}
function renderQ(){locked=false;let b=document.getElementById('quizBox');if(!set.length){b.innerHTML='<div class="small">暂无题目</div>';return}if(pos>=set.length){b.innerHTML='<div class="tip good">本轮完成，可以去错题本复习。</div><br><button class="primary" onclick="newQuiz()">再来一套</button>';return}let q=set[pos],x=p(q.id),opts=q.options||[];b.innerHTML='<div class="small">'+(pos+1)+' / '+set.length+' · '+esc(q.category)+(q.is_high_priority?' · 重点':'')+'</div><div class="q">'+esc(q.question)+'</div><div>'+opts.map((o,i)=>'<button class="option" onclick="answer('+i+',this)">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join('')+'</div><div id="exp" class="explain hidden"><b>解析：</b>'+esc(q.explanation||'')+'</div><div class="row" style="justify-content:space-between;margin-top:10px"><div><button class="outline" onclick="starCurrent()">'+(x.starred?'★ 已收藏':'☆ 收藏')+'</button> <button class="outline" onclick="masterCurrent()">'+(x.mastered?'✓ 已掌握':'标记已掌握')+'</button></div><button id="next" class="primary" disabled onclick="pos++;renderQ()">下一题</button></div>'}
async function answer(i,el){if(locked)return;locked=true;let q=set[pos],ans=Number(q.answer),buttons=[...document.querySelectorAll('.option')];buttons.forEach((o,j)=>{o.disabled=true;if(j===ans)o.classList.add('correct')});let good=i===ans;if(!good)el.classList.add('wrong');let x={...p(q.id)};x.attempts=(x.attempts||0)+1;x.correct_count=(x.correct_count||0)+(good?1:0);x.wrong_count=(x.wrong_count||0)+(good?0:1);x.is_wrong=x.is_wrong||!good;x.last_answer=i;qp.set(q.id,x);stats();document.getElementById('exp').classList.remove('hidden');document.getElementById('next').disabled=false;await saveQ(q.id,x)}
async function starCurrent(){let q=set[pos],x={...p(q.id),starred:!p(q.id).starred};qp.set(q.id,x);stats();renderQ();renderStar();await saveQ(q.id,x)}
async function masterCurrent(){let q=set[pos],x={...p(q.id),mastered:!p(q.id).mastered};qp.set(q.id,x);stats();renderQ();renderWrong();await saveQ(q.id,x)}
function tab(id){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='wrong')renderWrong();if(id==='star')renderStar();if(id==='new')renderNew()}
function renderWrong(){let rows=Q.filter(q=>{let x=p(q.id);return x.is_wrong&&!x.mastered});wrongBox.innerHTML=rows.length?rows.map((q,i)=>'<div class="item"><b>'+(i+1)+'. ['+esc(q.category)+'] '+esc(q.question)+'</b><div class="small">答案：'+String.fromCharCode(65+Number(q.answer))+'. '+esc((q.options||[])[Number(q.answer)])+'<br>'+esc(q.explanation||'')+'</div><br><button class="outline" onclick="masterId(\''+q.id+'\')">已掌握，移出错题本</button></div>').join(''):'<div class="good">目前没有待复习错题。</div>'}
async function masterId(id){let x={...p(id),mastered:true};qp.set(id,x);stats();renderWrong();await saveQ(id,x)}
function renderStar(){let rows=Q.filter(q=>p(q.id).starred);starBox.innerHTML=rows.length?rows.map((q,i)=>'<div class="item"><b>'+(i+1)+'. ['+esc(q.category)+'] '+esc(q.question)+'</b><div class="small">答案：'+String.fromCharCode(65+Number(q.answer))+'. '+esc((q.options||[])[Number(q.answer)])+'</div></div>').join(''):'<div class="small">暂时没有收藏。</div>'}
function renderNew(){let cut=Date.now()-7*864e5,rows=Q.filter(q=>new Date(q.updated_at||q.published_at||0).getTime()>=cut);newBox.innerHTML=rows.length?rows.map((q,i)=>'<div class="item"><b>'+(i+1)+'. ['+esc(q.category)+'] '+esc(q.question)+'</b><div class="small">答案：'+String.fromCharCode(65+Number(q.answer))+'. '+esc((q.options||[])[Number(q.answer)])+'</div></div>').join(''):'<div class="small">最近7天暂无新增。</div>'}
function resetCards(){let cat=cardCat.value;cards=C.filter(x=>cat==='ALL'||x.category===cat);cpos=0;flipped=false;renderCard()}
function renderCard(){if(!cards.length){cardBox.innerHTML='<span class="small">暂无卡片</span>';return}let x=cards[cpos];cardPos.textContent=(cpos+1)+' / '+cards.length;cardBox.innerHTML=flipped?'<div class="back">'+esc(x.back)+'</div>':'<b>'+esc(x.front)+'</b>'}
async function flipCard(){if(!cards.length)return;flipped=!flipped;renderCard();if(flipped){let x=cards[cpos],v={...cprog(x.id),seen_count:(cprog(x.id).seen_count||0)+1};cp.set(x.id,v);await saveC(x.id,v)}}
function prevCard(){if(!cards.length)return;cpos=(cpos-1+cards.length)%cards.length;flipped=false;renderCard()}
function nextCard(){if(!cards.length)return;cpos=(cpos+1)%cards.length;flipped=false;renderCard()}
async function reloadAll(){await loadBank();if(user)await loadProgress();toast('题库已刷新')}
function subscribe(){sb.channel('bank-live').on('postgres_changes',{event:'*',schema:'public',table:'questions'},()=>reloadAll()).on('postgres_changes',{event:'*',schema:'public',table:'cards'},()=>reloadAll()).on('postgres_changes',{event:'*',schema:'public',table:'app_meta'},()=>reloadAll()).subscribe()}
init();
</script>
</body></html>
